<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <style>
        * { margin:0; padding:0; box-sizing:border-box; }
        body, html { width:100vw; height:100vh; overflow:hidden; background:#000; }
        video {
            width:100vw; height:100vh;
            object-fit: contain;
            background:#000;
        }
    </style>
</head>
<body>
    <video id="myVideo" autoplay loop playsinline>
        <source src="video/profil1.mp4" type="video/mp4">
    </video>
    <script>
        const v = document.getElementById('myVideo');       
        v.play().then(() => {            
            v.muted = false;
        }).catch(() => {            
            v.muted = true;
            v.play().catch(()=>{});
        });
    </script>
</body>
</html>
